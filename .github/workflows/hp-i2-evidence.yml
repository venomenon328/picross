name: HP-I2 one-time originals

on:
  push:
    branches: [review/561-hp-i2-evidence-333d1f87]

permissions:
  contents: read

concurrency:
  group: hp-i2-originals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-control:
    strategy:
      fail-fast: false
      matrix:
        source: [964cfe2422a45871961760e65dcd863fe68ee5e0, 333d1f87e82d0fd396e71acda70c638204436c79]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          path: product
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/p1-toolchain-cache
          key: ${{ runner.os }}-godot-4.7.2-cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4-f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      - name: Diagnose the same existing pages fixture on baseline and candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: >-
          python3 review/tools/review_hp_i2/pages_diagnostic.py
          --root "$GITHUB_WORKSPACE/product"
          --cache "${{ runner.temp }}/p1-toolchain-cache"
          --expected-head "${{ matrix.source }}"
