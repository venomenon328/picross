name: HP-I2 one-time originals

on:
  push:
    branches: [review/561-hp-i2-evidence-333d1f87]

permissions:
  contents: read

concurrency:
  group: hp-i2-originals-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_HEAD: 333d1f87e82d0fd396e71acda70c638204436c79
  PYTHONUNBUFFERED: '1'

jobs:
  originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          path: product
          fetch-depth: 2
          persist-credentials: false
      - name: Restore verified official toolchain archives
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/p1-toolchain-cache
          key: ${{ runner.os }}-godot-4.7.2-cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4-f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      - name: Prepare the bounded synthetic image environment
        run: |
          command -v xvfb-run
          python3 -m venv "${{ runner.temp }}/hp-i2-env"
          "${{ runner.temp }}/hp-i2-env/bin/pip" install --only-binary=:all: -r product/tools/puzzle_production/requirements-image.txt
          mkdir -p "${{ runner.temp }}/hp-i2-tmp"
      - name: Compile reconstructed temporary Python helpers
        run: python3 -m py_compile review/tools/review_hp_i2/*.py
      - name: Produce exactly T01 T02 and six native originals
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}/hp-i2-tmp
        run: >-
          "${{ runner.temp }}/hp-i2-env/bin/python"
          review/tools/review_hp_i2/hp_i2_evidence.py
          --root "$GITHUB_WORKSPACE/product"
          --work "${{ runner.temp }}/hp-i2-work"
          --output "${{ runner.temp }}/hp-i2-originals"
          --cache "${{ runner.temp }}/p1-toolchain-cache"
          --product-head "$PRODUCT_HEAD"
      - name: Upload only the approved head-bound originals
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hp-i2-originals-${{ env.PRODUCT_HEAD }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hp-i2-originals/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  catalog-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/p1-toolchain-cache
          key: ${{ runner.os }}-godot-4.7.2-cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4-f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      - name: Prepare the selected-module diagnostic environment
        run: |
          python3 -m venv "${{ runner.temp }}/catalog-env"
          "${{ runner.temp }}/catalog-env/bin/pip" install --only-binary=:all: -r tools/puzzle_production/requirements-image.txt
          mkdir -p "${{ runner.temp }}/catalog-tmp"
      - name: Reproduce only the failed native.catalog with direct phase logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}/catalog-tmp
        run: >-
          "${{ runner.temp }}/catalog-env/bin/python"
          tools/p1_product.py
          --native-group catalog
          --cache-dir "${{ runner.temp }}/p1-toolchain-cache"
          --output-dir "${{ runner.temp }}/catalog-output"
          --technical-dir "${{ runner.temp }}/catalog-technical"
      - name: Report compact failed-module diagnostics without image archives
        if: failure()
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}/catalog-technical
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["DIAGNOSTIC_ROOT"])
          for path in sorted(root.rglob("*")):
              if path.suffix not in (".log", ".json") or not path.is_file():
                  continue
              text=path.read_text(errors="replace")
              if path.name.endswith("result.json") or any(x in text for x in ("SCRIPT ERROR:", "FAIL:", "KAT2_FAIL", "Traceback", '"passed": false', '"status": "failure"')):
                  print("DIAGNOSTIC", path.relative_to(root))
                  print(text[-24000:])
          PY
