name: GAME-APP-D Windows review
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  review:
    if: github.repository == 'venomenon328/picross' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    env:
      PG_REVIEW_PRODUCT_HEAD: 334cf125eebe503126c3bd349907a11fe5690aa4
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - shell: pwsh
        run: Copy-Item -LiteralPath .ci/pg-review-731.py -Destination "$env:RUNNER_TEMP/pg-review-731.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PG_REVIEW_PRODUCT_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.13.14'
          architecture: x64
      - name: Pinned Windows probe dependencies
        run: python -m pip install --only-binary=:all: Pillow==12.3.0 -r tools/production_workspace/requirements-update.txt
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: Picross-Spiel-${{ env.PG_REVIEW_PRODUCT_HEAD }}
          path: ${{ runner.temp }}/pg-candidate
          github-token: ${{ github.token }}
          run-id: 44839399616
      - name: Native launcher originals and isolated passive MSI transition
        shell: pwsh
        run: >-
          python "$env:RUNNER_TEMP/pg-review-731.py"
          "$env:RUNNER_TEMP/pg-windows-originals"
          "$env:RUNNER_TEMP/pg-windows-work"
          "$env:RUNNER_TEMP/pg-candidate"
          "$env:PG_REVIEW_PRODUCT_HEAD"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: game-app-d-windows-originals
          path: ${{ runner.temp }}/pg-windows-originals/*
          retention-days: 7
          if-no-files-found: error
