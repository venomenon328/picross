name: Puzzle production verification
on:
  workflow_dispatch:
    inputs:
      groups:
        description: Temporary PW-B diagnostic, selected groups only
        type: string
        default: adapter,catalog
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0293675df2f7e9cf4c54dca86d3c01fca0202afb
          fetch-depth: 2
          persist-credentials: false
      - name: Install selected image dependency
        run: |
          python3 -m venv "${{ runner.temp }}/pw-diagnostic-env"
          "${{ runner.temp }}/pw-diagnostic-env/bin/pip" install --only-binary=:all: -r tools/puzzle_production/requirements-image.txt
          echo "${{ runner.temp }}/pw-diagnostic-env/bin" >> "$GITHUB_PATH"
      - name: Source-bound first failure in selected families, logs only
        run: |
          git rev-parse HEAD
          python3 - <<'PY'
          import sys, unittest
          sys.path[:0] = ['.', 'tests/puzzle_production']
          from tools.production_contract import MODULES
          names = list(MODULES['adapter']) + list(MODULES['catalog'])
          suite = unittest.TestLoader().loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2, failfast=True).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
