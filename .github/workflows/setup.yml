name: Setup verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: setup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Source pin from dev-rules
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validator tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Documentation checks
        run: python3 tools/check_docs.py
      - name: Full change whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git show --format= --check "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi
