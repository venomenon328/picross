name: CI verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Widen the changed-path selection
        type: choice
        options: [auto, all, runtime, visual, perf-b, production, toolchain]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    outputs:
      product: ${{ steps.scope.outputs.product }}
      production: ${{ steps.scope.outputs.production }}
      preflight: ${{ steps.scope.outputs.preflight }}
      integration: ${{ steps.scope.outputs.integration }}
      pilots: ${{ steps.scope.outputs.pilots }}
      visual: ${{ steps.scope.outputs.visual }}
      perf_b: ${{ steps.scope.outputs.perf_b }}
      web: ${{ steps.scope.outputs.web }}
      delivery: ${{ steps.scope.outputs.delivery }}
    steps:
      - name: Checkout tested integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            tools/ci_scope.py
            .gitattributes
          sparse-checkout-cone-mode: false
      - name: Select required checks from the complete diff
        id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE: ${{ inputs.scope || 'auto' }}
        run: >-
          python3 tools/ci_scope.py plan --fetch
          --base "$CI_BASE" --head "$CI_HEAD" --scope "$CI_SCOPE"
          --output "${{ runner.temp }}/ci-plan.json"
      - name: Materialize sources for code and documentation checks
        if: steps.scope.outputs.content_only != 'true'
        run: git sparse-checkout disable
      - name: Fast tool contracts and CI gate regression
        if: steps.scope.outputs.content_only != 'true'
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Documentation checks
        if: steps.scope.outputs.content_only != 'true'
        run: python3 tools/check_docs.py
      - name: Content delivery scope only
        if: steps.scope.outputs.content_only == 'true'
        run: echo "Content-only delivery. Certification and editorial evidence belong to production; no puzzle, runtime, visual or export tests run in CI."
      - name: Upload selection and source binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan.json
          if-no-files-found: warn
          retention-days: 7

  product:
    needs: docs
    if: needs.docs.outputs.product == 'true'
    uses: ./.github/workflows/p1-product.yml
    with:
      integration: ${{ needs.docs.outputs.integration == 'true' }}
      pilots: ${{ needs.docs.outputs.pilots == 'true' }}
      visual: ${{ needs.docs.outputs.visual == 'true' }}
      perf_b: ${{ needs.docs.outputs.perf_b == 'true' }}

  production:
    needs: docs
    if: needs.docs.outputs.production == 'true'
    uses: ./.github/workflows/puzzle-production.yml

  preflight:
    needs: docs
    if: needs.docs.outputs.preflight == 'true'
    uses: ./.github/workflows/p1-preflight.yml

  web:
    needs: docs
    if: needs.docs.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  delivery:
    needs: docs
    if: needs.docs.outputs.delivery == 'true'
    uses: ./.github/workflows/delivery.yml

  ci-required:
    if: always()
    needs: [docs, product, production, preflight, web, delivery]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout only the result evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tools/ci_scope.py
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Download complete selection for the result gate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-selection
      - name: Require every selected job to have actually succeeded
        env:
          CI_RESULTS: >-
            {"docs":{"result":"${{ needs.docs.result }}"},
            "product":{"result":"${{ needs.product.result }}"},
            "production":{"result":"${{ needs.production.result }}"},
            "preflight":{"result":"${{ needs.preflight.result }}"},
            "web":{"result":"${{ needs.web.result }}"},
            "delivery":{"result":"${{ needs.delivery.result }}"}}
          CI_OUTPUTS: ${{ toJSON(needs.docs.outputs) }}
          CI_BINDING: >-
            {"source_head":"${{ github.event.pull_request.head.sha || github.sha }}",
            "base_commit":"${{ github.event.pull_request.base.sha || github.event.before || github.sha }}",
            "tested_checkout":"${{ github.sha }}", "event":"${{ github.event_name }}",
            "run_id":"${{ github.run_id }}", "run_attempt":"${{ github.run_attempt }}"}
        run: >-
          python3 tools/ci_scope.py finish
          --plan-file "${{ runner.temp }}/ci-selection/ci-plan.json"
          --output "${{ runner.temp }}/ci-result.json"
      - name: Upload complete result and source binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-result-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-result.json
          if-no-files-found: error
          retention-days: 7
