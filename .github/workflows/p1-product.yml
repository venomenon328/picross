name: SYNC-PROGRESS-A01 Windows original
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-proof:
    if: github.ref == 'refs/heads/chore/821-sync-progress-proof'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 76f2034ab929ca2ec40f8eba6aa0b2c615ba62aa
          path: product
          persist-credentials: false
      - name: Windows native profile, replacement, restart and separate reader
        working-directory: product
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install --only-binary=:all: -r tools/puzzle_production/requirements-image.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ../proof/tools/progress_windows.py 76f2034ab929ca2ec40f8eba6aa0b2c615ba62aa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-progress-76f2034ab929ca2ec40f8eba6aa0b2c615ba62aa
          path: ${{ runner.temp }}/windows-progress.zip
          if-no-files-found: error
          retention-days: 7
  database-proof:
    if: github.ref == 'refs/heads/chore/821-sync-progress-proof'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 76f2034ab929ca2ec40f8eba6aa0b2c615ba62aa
          path: product
          persist-credentials: false
      - name: PostgreSQL migration rollback, upgrade, retry, backup and restore
        working-directory: product
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python ../proof/tools/progress_database.py 76f2034ab929ca2ec40f8eba6aa0b2c615ba62aa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-progress-76f2034ab929ca2ec40f8eba6aa0b2c615ba62aa
          path: ${{ runner.temp }}/migration-progress.json
          if-no-files-found: error
          retention-days: 7
