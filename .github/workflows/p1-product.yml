name: P1 product verification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_full_evidence:
        description: Upload the complete temporary product evidence tree (large)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: p1-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Isolated image dependency
        run: |
          python3 -m venv "${{ runner.temp }}/rp3-image-env"
          "${{ runner.temp }}/rp3-image-env/bin/python" -m pip install --only-binary=:all: -r tools/puzzle_production/requirements-image.txt
          echo "${{ runner.temp }}/rp3-image-env/bin" >> "$GITHUB_PATH"
      - name: Import, tests, start and Windows export
        env:
          P1_PREFLIGHT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 tools/p1_product.py
          --cache-dir "${{ runner.temp }}/p1-product-cache"
          --output-dir "${{ runner.temp }}/p1-product-output"
          --download-timeout-seconds 1200
          --process-timeout-seconds 300
      - name: Upload complete technical product evidence (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_full_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picross-p1-technical-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload compact player package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picross-p1-player-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/picross-p1-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload GP-48 native comparisons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gp48-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/picross-gp48-review.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload ZV-50 native zoom comparisons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zv50-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/picross-zv50-review.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload RP-3 review renders
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp3-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/p1-product-output/renders/rp3-*.png
            ${{ runner.temp }}/p1-product-output/renders/rp3-renders.json
            ${{ runner.temp }}/p1-product-output/product-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload RP-6 compact review package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp6-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/rp6-review/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload isolated ZS-1 Windows study
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zs1-windows-study-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/picross-zs1-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload compact ZS-1 native comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zs1-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/picross-zs1-review.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload separate ZS-1 stroke progression evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zs1-strokes-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/picross-zs1-strokes.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
