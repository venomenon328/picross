name: P1 product verification

on:
  workflow_call:
    inputs:
      integration:
        type: boolean
        default: true
      pilots:
        type: boolean
        default: true
      visual:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      integration:
        description: Run the 500-action sequence and restart
        type: boolean
        default: true
      pilots:
        description: Exercise all six registered pilot puzzles
        type: boolean
        default: true
      visual:
        description: Run the compact current native pixel matrix
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: p1-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.pilots && 15 || 10 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Restore official toolchain archives
        id: toolchain
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/p1-toolchain-cache
          key: ${{ runner.os }}-godot-4.7.2-cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4-f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      - name: Isolated image dependency
        run: |
          python3 -m venv "${{ runner.temp }}/rp3-image-env"
          "${{ runner.temp }}/rp3-image-env/bin/python" -m pip install --only-binary=:all: -r tools/puzzle_production/requirements-image.txt
          echo "${{ runner.temp }}/rp3-image-env/bin" >> "$GITHUB_PATH"
      - name: Current regression, selected integration, pixels and player export
        env:
          P1_PREFLIGHT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          P1_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: >-
          python3 tools/p1_product.py
          --cache-dir "${{ runner.temp }}/p1-toolchain-cache"
          --output-dir "${{ runner.temp }}/p1-product-output"
          --download-timeout-seconds 180
          --process-timeout-seconds 300
          ${{ inputs.integration && '--integration' || '--no-integration' }}
          ${{ inputs.pilots && '--pilots' || '--no-pilots' }}
          ${{ inputs.visual && '--visual' || '--no-visual' }}
      - name: Save verified toolchain archives
        if: success() && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/p1-toolchain-cache
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Upload compact player package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picross-p1-player-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/picross-p1-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload bounded current evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picross-p1-technical-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/technical/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
