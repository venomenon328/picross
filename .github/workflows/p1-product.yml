name: SYNC-B1-A01 Windows original
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-proof:
    if: github.ref == 'refs/heads/chore/821-sync-b1-a01'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 441e87139aec7fc9b3b12b3f970757788d59c4ce
          path: product
          persist-credentials: false
      - name: Windows native profile, replacement, restart and separate reader
        working-directory: product
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install --only-binary=:all: -r tools/puzzle_production/requirements-image.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ../proof/tools/sync_b1_a01.py 441e87139aec7fc9b3b12b3f970757788d59c4ce
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sync-b1-a01-441e87139aec7fc9b3b12b3f970757788d59c4ce
          path: ${{ runner.temp }}/sync-b1-a01-windows.zip
          if-no-files-found: error
          retention-days: 7
