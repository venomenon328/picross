name: P1 product verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import, tests, start and Windows export
        env:
          P1_PREFLIGHT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 tools/p1_product.py
          --cache-dir "${{ runner.temp }}/p1-product-cache"
          --output-dir "${{ runner.temp }}/p1-product-output"
          --download-timeout-seconds 1200
          --process-timeout-seconds 300
      - name: Upload Windows intermediate build and technical evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picross-p1-windows-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-product-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
