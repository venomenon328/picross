name: PW remote
run-name: PW remote ${{ github.event.workflow_run.head_branch }}
on:
  workflow_run:
    workflows: [Working ref publication check]
    types: [completed]
    branches: ['work-prod-control/remote/**']

permissions: {}
jobs:
  worker:
    if: >-
      (github.repository == 'venomenon328/picross' || (github.repository == 'venomenon328/picross-remote-test' && github.repository_id == '1470169013')) &&
      github.ref == 'refs/heads/main' && github.event.workflow_run.path == '.github/workflows/work-growth.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
    env:
      PICROSS_PW_REMOTE_TEST: ${{ github.repository_id == '1470169013' && '1' || '0' }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_AUTHOR_NAME: Picross production
      GIT_AUTHOR_EMAIL: picross-production@users.noreply.github.com
      GIT_COMMITTER_NAME: Picross production
      GIT_COMMITTER_EMAIL: picross-production@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /content/difficulty-method.json
            /content/categories.json
            /docs/difficulty/
      - name: Select configured repository installation
        if: vars.PW_REMOTE_APP_ID != ''
        id: installation
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PW_REMOTE_APP_ID }}
          private-key: ${{ secrets.PW_REMOTE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write
      - name: Read capabilities and trigger before image setup
        id: gate
        env:
          GH_TOKEN: ${{ steps.installation.outputs.token || github.token }}
        run: python3 -B -m tools.production_remote worker-preflight --root "$RUNNER_TEMP" --auth GH_TOKEN
      - name: Install trusted image dependencies
        if: steps.gate.outputs.images == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/pw-venv"
          "$RUNNER_TEMP/pw-venv/bin/pip" install --only-binary=:all: -r tools/puzzle_production/requirements-image.txt
          echo "$RUNNER_TEMP/pw-venv/bin" >> "$GITHUB_PATH"
      - name: Execute and acknowledge bound operation
        env:
          GH_TOKEN: ${{ steps.installation.outputs.token || github.token }}
          PW_REMOTE_AUTH_KIND: ${{ steps.installation.outputs.token && 'installation' || 'workflow-token' }}
        run: python3 -B -m tools.production_remote worker --root "$RUNNER_TEMP" --auth GH_TOKEN
