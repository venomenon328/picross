name: SYNC-UX-A01 · review originals
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product head
        required: true
        type: string
      public_key:
        description: Ephemeral RSA public key in base64 DER
        required: true
        type: string
      size:
        description: Byte length of the exact ZIP
        required: true
        type: string
      digest:
        description: SHA-256 of the exact ZIP
        required: true
        type: string
permissions:
  contents: read
  statuses: read
jobs:
  originals:
    if: github.ref == 'refs/heads/diag/821-sync-ux-a01'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_HEAD: ${{ inputs.product }}
      UPLOAD_PUBLIC_KEY: ${{ inputs.public_key }}
      ORIGINAL_SIZE: ${{ inputs.size }}
      ORIGINAL_DIGEST: ${{ inputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/821-review-originals
        env:
          TRANSFER_PHASE: prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: encrypted-upload-ticket
          path: ${{ runner.temp }}/821-upload-ticket.json
          retention-days: 1
          if-no-files-found: error
      - uses: ./.github/actions/821-review-originals
        env:
          TRANSFER_PHASE: finish
          STATUS_READ_TOKEN: ${{ github.token }}
