name: SYNC-B2 temporary technical originals
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, probe: chromium}
          - {os: ubuntu-24.04, probe: firefox}
          - {os: windows-2025, probe: windows}
          - {os: ubuntu-24.04, probe: legacy}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PRODUCT: d5aaf8384a4ad59eec557eed1f276bf118028ff2
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT }}
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact product
        shell: bash
        run: test "$(git -C repo rev-parse HEAD)" = "$PRODUCT"
      - name: Restore official Linux toolchain archives
        if: runner.os == 'Linux' && matrix.probe != 'legacy'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/p1-toolchain-cache
          key: Linux-godot-4.7.2-cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4-f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      - if: matrix.probe != 'legacy'
        name: Isolate probe Python
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/b2-env"
          if [ "$RUNNER_OS" = Windows ]; then echo "$RUNNER_TEMP/b2-env/Scripts" >> "$GITHUB_PATH"; else echo "$RUNNER_TEMP/b2-env/bin" >> "$GITHUB_PATH"; fi
      - name: Install scoped probe dependencies
        if: matrix.probe != 'legacy'
        run: python -m pip install playwright==1.58.0 -r repo/tools/puzzle_production/requirements-image.txt
      - if: matrix.probe == 'windows'
        run: python -m pip install --require-hashes -r repo/server/save_sync/requirements.txt
      - if: matrix.probe == 'chromium' || matrix.probe == 'firefox'
        run: python -m playwright install --with-deps ${{ matrix.probe }}
      - if: matrix.probe != 'legacy'
        name: Export normal product with isolated service and read-only observer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .b2-review/build.py
      - if: matrix.probe == 'legacy'
        working-directory: repo
        run: python ../.b2-review/legacy_probe.py
      - if: matrix.probe == 'chromium' || matrix.probe == 'firefox'
        run: xvfb-run -a python .b2-review/e2e_web.py ${{ matrix.probe }}
      - if: matrix.probe == 'windows'
        run: python .b2-review/e2e_native.py
      - if: always()
        name: Hash individually selected non-secret originals
        env: {PROBE: '${{ matrix.probe }}'}
        run: python .b2-review/manifest.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SYNC-B2-${{ matrix.probe }}-${{ env.PRODUCT }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            selected/manifest.json
            selected/status-ui100.png
            selected/status-ui125.png
            selected/http.json
            selected/journal.json
            selected/account-save.json
            selected/platform.json
            selected/legacy-receipts.json
            selected/barriers.json
