name: Selected Chromium groups

on:
  workflow_call:
    inputs:
      browser_request:
        type: string
        required: true
      browser_scope:
        type: string
        required: true
      selection_attempt:
        type: string
        required: true
    outputs:
      chromium_attempt:
        value: ${{ jobs.chromium.outputs.attempt }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      attempt: ${{ steps.producer.outputs.attempt }}
    steps:
      - name: Require original explicit browser request before setup
        env:
          EVENT: ${{ github.event_name }}
          ORIGINAL_SCOPE: ${{ github.event.inputs.browser_scope }}
          BROWSER_SCOPE: ${{ inputs.browser_scope }}
          BROWSER_REQUEST: ${{ inputs.browser_request }}
        run: |
          [ "$EVENT" = workflow_dispatch ] && [ "$ORIGINAL_SCOPE" = "$BROWSER_SCOPE" ] || exit 1
          case "$BROWSER_SCOPE" in
            regular|catalog|input|completion|persistence|all) ;;
            *) echo 'Missing or invalid explicit browser scope' >&2; exit 1 ;;
          esac
          expected='{"browser":"chromium","scope":"'"$BROWSER_SCOPE"'"}'
          [ "$BROWSER_REQUEST" = "$expected" ] || exit 1
      - name: Bind build producer attempt
        id: producer
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/p1-toolchain-cache
          key: ${{ runner.os }}-godot-4.7.2-cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4-f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      - name: Download bound selection
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}-${{ inputs.selection_attempt }}
          path: ${{ runner.temp }}/ci-selection
      - name: Validate selected request against original event and checkout
        env:
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python3 tools/web_tests/run_groups.py check --plan "${{ runner.temp }}/ci-selection/ci-plan.json" --build-root artifacts
      - name: Isolated image dependency for synthetic AT exports
        run: |
          python3 -m venv "${{ runner.temp }}/web-build-env"
          "${{ runner.temp }}/web-build-env/bin/pip" install --only-binary=:all: -r tools/puzzle_production/requirements-image.txt
          echo "${{ runner.temp }}/web-build-env/bin" >> "$GITHUB_PATH"
      - name: Build regular player and separate fixed technical player
        run: |
          python3 tools/build_web_player.py --cache-dir "${{ runner.temp }}/p1-toolchain-cache" --output-dir artifacts/web-player
          python3 tools/build_web_player.py --cache-dir "${{ runner.temp }}/p1-toolchain-cache" --output-dir artifacts/web-test --test
          python3 tools/build_web_player.py --cache-dir "${{ runner.temp }}/p1-toolchain-cache" --output-dir artifacts/web-test-update --test --test-reveal-revision 2
      - name: Seal current builds and source binding
        env:
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          python3 tools/web_tests/run_groups.py seal --plan "${{ runner.temp }}/ci-selection/ci-plan.json" --build-root artifacts
      - name: Transfer verified builds within this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-web-builds-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/builds.json
            artifacts/web-player/
            artifacts/web-test/
            artifacts/web-test-update/
          if-no-files-found: error
          retention-days: 7
      - name: Upload regular static player
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picross-web-player-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/web-player/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picross-web-build-logs-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/*-logs/
          retention-days: 7

  chromium:
    needs: build
    uses: ./.github/workflows/browser-chromium.yml
    with:
      browser: chromium
      browser_request: ${{ inputs.browser_request }}
      browser_scope: ${{ inputs.browser_scope }}
      build_attempt: ${{ needs.build.outputs.attempt }}
      selection_attempt: ${{ inputs.selection_attempt }}
