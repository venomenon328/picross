name: Manual production assistant installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Pin latest fetched main commit
        id: source
        shell: pwsh
        run: |
          $source = git rev-parse --verify origin/main
          if ($LASTEXITCODE -ne 0 -or $source -cnotmatch '^[0-9a-f]{40}$') { throw 'Full main SHA required' }
          git checkout --detach $source
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
          "source_commit=$source" >> $env:GITHUB_OUTPUT
          Write-Host "Installer source: main@$source"
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.13.14'
          architecture: x64
      - name: Pinned private build environment
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\pw-env"
          & "$env:RUNNER_TEMP\pw-env\Scripts\python.exe" -m pip install pip==26.1.2
          if ($LASTEXITCODE -ne 0) { throw 'pip setup failed' }
          & "$env:RUNNER_TEMP\pw-env\Scripts\python.exe" -m pip install --only-binary=:all: -r tools/production_workspace/requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency setup failed' }
      - name: Build payload and MSI, then isolated installer lifecycle
        shell: pwsh
        env:
          SMOKE_HARNESS_COMMIT: ${{ github.workflow_sha }}
        run: |
          & "$env:RUNNER_TEMP\pw-env\Scripts\python.exe" -m tools.production_workspace.build_installer --output "$env:RUNNER_TEMP\pw-product"
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          # Temporary pre-merge test of exact harness bytes; product stays on main.
          $harness = New-Item -ItemType Directory "$env:RUNNER_TEMP\pw-harness"
          foreach ($name in @('smoke-user.ps1', 'smoke-bootstrap.ps1')) {
            git show "${env:SMOKE_HARNESS_COMMIT}:tools/production_workspace/packaging/$name" | Set-Content -Encoding utf8 (Join-Path $harness $name)
            if ($LASTEXITCODE -ne 0) { throw 'Harness snapshot failed' }
          }
          git show "${env:SMOKE_HARNESS_COMMIT}:tools/production_workspace/smoke_installer.py" | Set-Content -Encoding utf8 tools/production_workspace/smoke_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Smoke source snapshot failed' }
          & (Join-Path $harness 'smoke-user.ps1') -Python "$env:RUNNER_TEMP\pw-env\Scripts\python.exe" -Build "$env:RUNNER_TEMP\pw-product" -Output "$env:RUNNER_TEMP\pw-smoke"
      - name: Targeted product download, no release or deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Picross-Produktionsassistent-${{ steps.source.outputs.source_commit }}
          path: |
            ${{ runner.temp }}/pw-product/*.msi
            ${{ runner.temp }}/pw-product/*.msi.sha256
            ${{ runner.temp }}/pw-product/START.txt
            ${{ runner.temp }}/pw-product/delivery.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
