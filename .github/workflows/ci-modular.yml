name: CAT-CONS-A befristete Revieworiginale
on:
  workflow_dispatch:
    inputs:
      review_attachment:
        description: "Gebundene SHA-Werte und lokale Zugriffsmessungen für #909"
        required: true
        type: string
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          path: proof
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/pull/909/merge
          path: product
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: baseline
          persist-credentials: false
      - name: Eingangsbindung und originale Vorhermessung
        env:
          BINDING: ${{ inputs.review_attachment }}
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          b=json.loads(os.environ["BINDING"])
          def oid(folder,ref):
              return subprocess.check_output(["git","-C",folder,"rev-parse",ref],text=True).strip()
          assert oid("product","HEAD") == b["testmerge"]
          assert oid("product","HEAD^2") == b["head"]
          assert oid("baseline","HEAD") == oid("product","HEAD^1") == b["base"]
          p=pathlib.Path("review")
          p.mkdir()
          for stage in ("before","after"):
              raw=gzip.decompress(base64.b64decode(b[stage],validate=True))
              assert hashlib.sha256(raw).hexdigest()==b[stage+"_sha256"]
              (p/("T03-local-"+stage+".json")).write_bytes(raw)
          (p/"binding.json").write_text(json.dumps({k:v for k,v in b.items() if k not in ("before","after")},indent=2)+"\n")
          PY
      - name: Gebundene isolierte Python-Umgebung
        run: |
          python -m venv env
          env/bin/pip install -r product/tools/puzzle_production/requirements-image.txt -r product/tools/production_workspace/requirements-update.txt
      - name: Vorher-Inventar am tatsächlich gebundenen Main rekonstruieren
        working-directory: baseline
        run: |
          ../env/bin/python ../proof/inventory.py
          ../env/bin/python -c 'import hashlib,json,pathlib; b=json.loads(pathlib.Path("../review/binding.json").read_bytes()); assert hashlib.sha256(pathlib.Path("../before.json").read_bytes()).hexdigest() == b["inventory_sha256"]'
      - name: Feldvergleich, Hashes, entfernte Quellen, zweiter Projektionslauf
        working-directory: product
        run: ../env/bin/python ../proof/compare_catalog.py
      - name: Identische synthetische Zugriffe auf Basis und Testmerge
        run: |
          (cd baseline && ../env/bin/python ../proof/measure.py before)
          (cd product && ../env/bin/python ../proof/measure.py after)
          mv measurement-before.json review/T03-runner-before.json
          mv measurement-after.json review/T03-runner-after.json
      - name: Neuer Produktionsjob, Fortsetzung, bestätigter Main und technische App-Bindungen
        working-directory: product
        run: |
          set -o pipefail
          ../env/bin/python -m unittest -v tests.puzzle_production.test_current_completion tools.test_workspace_deliveries tools.test_production_remote.RemoteTests.test_combined_fixed_publication_recovery_and_result_originals tools.test_editor_installer tools.test_production_installer 2>&1 | tee ../review/T03-consumers.log
      - name: Größen und SHA-256
        if: always()
        run: |
          cd review
          sha256sum *.json *.log 2>/dev/null | tee SHA256SUMS
          wc -c *.json *.log 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: CAT-CONS-A-A01-${{ github.run_id }}
          path: review/
          retention-days: 7
          if-no-files-found: error
