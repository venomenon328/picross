name: Web export and isolated reference verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/p1-toolchain-cache
          key: ${{ runner.os }}-godot-4.7.2-cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4-f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      - name: Isolated browser tooling
        run: |
          python3 -m venv "${{ runner.temp }}/web-venv"
          "${{ runner.temp }}/web-venv/bin/pip" install playwright==1.58.0
          "${{ runner.temp }}/web-venv/bin/playwright" install --with-deps chromium firefox
          sudo apt-get update
          sudo apt-get install -y openssh-server
      - name: Build regular player and separate fixed technical player
        run: |
          python3 tools/build_web_player.py --cache-dir "${{ runner.temp }}/p1-toolchain-cache" --output-dir artifacts/web-player
          python3 tools/build_web_player.py --cache-dir "${{ runner.temp }}/p1-toolchain-cache" --output-dir artifacts/web-test --test
          python3 tools/build_web_player.py --cache-dir "${{ runner.temp }}/p1-toolchain-cache" --output-dir artifacts/web-test-update --test
      - name: Real isolated SSH and static HTTP reference
        run: python3 tools/web_tests/ssh_reference.py --build artifacts/web-player --output artifacts/web-evidence
      - name: Actual Chromium and Firefox event and persistence routes
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PICROSS_WEB_SOFTWARE: '1'
        run: |
          xvfb-run -a "${{ runner.temp }}/web-venv/bin/python" tools/web_tests/smoke.py --build artifacts/web-player --output artifacts/web-evidence
          xvfb-run -a "${{ runner.temp }}/web-venv/bin/python" tools/web_tests/browser.py --build artifacts/web-test --update-build artifacts/web-test-update --output artifacts/web-evidence
      - name: Upload regular static player
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picross-web-player-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/web-player/
          if-no-files-found: error
          retention-days: 14
      - name: Upload actual diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picross-web-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/web-evidence/
            artifacts/web-player-logs/
            artifacts/web-test-logs/
            artifacts/web-test/build-manifest.json
            artifacts/web-test-update-logs/
            artifacts/web-test-update/build-manifest.json
          retention-days: 7
