e-width="0.7" /></g><path d="M44 300 H606 L610 304 V514 L606 518 H44 L40 514 V304 Z" fill="url(#card)" stroke="#8c7047" /><path d="M664 300 H1226 L1230 304 V514 L1226 518 H664 L660 514 V304 Z" fill="url(#card)" stroke="#8c7047" /><text x="40" y="54" font-family="PlexSans, sans-serif" font-size="28" fill="#293e3d" style="font-family:Fraunces,serif;font-weight:600">Anschluss der Informationsseite</text><text x="40" y="86" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Schematischer rechter Anschluss · kein drittes Buchbild, keine native Navigation</text><g data-action="nav-album" data-state="normal" data-target="album"><rect x="58" y="144" width="44" height="44" fill="none" stroke="none" data-hit="true"/><g transform="translate(67 153) scale(1)"><path d="M3 4 h8 v18 H3 Z M11 4 h10 v18 H11 M6 8 h2 M14 8 h4" fill="none" stroke="#293e3d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><title>Album öffnen · Sammlung und Blattauswahl</title></g><text x="118" y="174" font-family="PlexSans, sans-serif" font-size="22" fill="#293e3d" >Album</text><text x="58" y="217" font-family="PlexSans, sans-serif" font-size="16" fill="#293e3d" >Sammlung / Blattauswahl</text><text x="58" y="242" font-family="PlexSans, sans-serif" font-size="14" fill="#293e3d" >nav-album → album</text><g data-action="nav-work" data-state="active" data-target="work"><rect x="468" y="144" width="44" height="44" fill="none" stroke="none" data-hit="true"/><g transform="translate(477 153) scale(1)"><path d="M20 12 H4 m7 -7 l-7 7 7 7" fill="none" stroke="#fffaf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M479 182 H501" fill="none" stroke="#fffaf0" stroke-width="2" /><title>Zur Arbeitsseite zurück · Arbeitsstand erhalten</title></g><text x="528" y="174" font-family="PlexSans, sans-serif" font-size="22" fill="#293e3d" >Arbeitsseite</text><text x="468" y="217" font-family="PlexSans, sans-serif" font-size="16" fill="#293e3d" >Raster / eigene Miniatur / Werkzeuge</text><text x="468" y="242" font-family="PlexSans, sans-serif" font-size="14" fill="#293e3d" >nav-work → work</text><g data-action="nav-information" data-state="normal" data-target="information"><rect x="878" y="144" width="44" height="44" fill="none" stroke="none" data-hit="true"/><g transform="translate(887 153) scale(1)"><path d="M4 12 h16 m-7 -7 l7 7 -7 7" fill="none" stroke="#293e3d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><title>Informationsseite öffnen · Einstellungen und Hilfe</title></g><text x="938" y="174" font-family="PlexSans, sans-serif" font-size="22" fill="#293e3d" >Information</text><text x="878" y="217" font-family="PlexSans, sans-serif" font-size="16" fill="#293e3d" >Einstellungen / Hilfe</text><text x="878" y="242" font-family="PlexSans, sans-serif" font-size="14" fill="#293e3d" >nav-information → information</text><text x="64" y="340" font-family="PlexSans, sans-serif" font-size="23" fill="#293e3d" font-weight="600">Einstellungen</text><text x="64" y="376" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >UI-Skalierung: 100 % / 125 %</text><text x="64" y="409" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Hinweise rasterseitig ausrichten</text><text x="64" y="442" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Erfüllte Hinweise markieren · sitzungsweit</text><text x="64" y="475" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Beenden · Pflicht-Flush bleibt verbindlich</text><text x="684" y="340" font-family="PlexSans, sans-serif" font-size="23" fill="#293e3d" font-weight="600">Hilfe</text><text x="684" y="376" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Füllen / Radierer / Hand</text><text x="684" y="409" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Hinweisfolgen einzeln ziehen; Tooltip ergänzt</text><text x="684" y="442" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Escape verwirft die laufende Geste</text><text x="684" y="475" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Statistik: später / Umfang offen</text><text x="40" y="564" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Rückweg aus Album und Information: nav-work → work · „Zur Arbeitsseite zurück · Arbeitsstand erhalten“</text><text x="40" y="598" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Erhalten: Zellen, Undo/Redo, Farbe/Werkzeug, Rasterfokus/Zoom und bestätigte Hinweislesepositionen.</text><text x="40" y="632" font-family="PlexSans, sans-serif" font-size="17" fill="#293e3d" >Gesten vorher abbrechen. Pflicht-Flush und Recovery-Schreibsperre nicht umgehen. Keine Live-Korrektheitsanzeige.</text><text x="40" y="682" font-family="PlexSans, sans-serif" font-size="16" fill="#293e3d" >Präsentationsumschaltung in der Galerie prüft keine dieser nativen Funktionen.</text>
