<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buchstudie B-A</title>
<style>html,body{margin:0;width:100%;height:100%;background:#302b25}canvas{display:block;width:100%;height:100%}#status{position:fixed;top:1em;left:1em;color:#fff;font:16px sans-serif}</style>
</head>
<body>
<canvas id="canvas">WebGL 2 wird benötigt.</canvas>
<div id="status">Buchstudie wird geladen …</div>
<script src="$GODOT_URL"></script>
<script>
// The reused catalog can read this status; study preferences are memory only.
window.picrossStorage = {preferenceError: ''};
const engine = new Engine($GODOT_CONFIG);
engine.startGame({canvas: document.getElementById('canvas'),canvasResizePolicy:2,args:['--audio-driver','Dummy']})
  .then(() => document.getElementById('status').remove())
  .catch(error => {document.getElementById('status').textContent = 'Start fehlgeschlagen: ' + error.message;});
</script>
</body>
</html>
