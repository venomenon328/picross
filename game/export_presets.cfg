[preset.0]

name="P1 Windows x86_64"
platform="Windows Desktop"
runnable=true
advanced_options_enabled=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/content/*.json,art/content/*.txt,art/book/*.json,art/book/*.txt,art/drawing/delight-coffee/*,art/drawing/tidy-hand/*"
exclude_filter="tests/*,data/*proof*,study/*,full_view_study/*,perf_a/*,ui/pencil_marks.gd"
export_path="build/windows/picross-p1.exe"
script_export_mode=2

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=1
codesign/enable=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]

name="P1 Web"
platform="Web"
runnable=false
export_filter="all_resources"
include_filter="data/*.json,data/content/*.json,art/content/*.txt,art/book/*.json,art/book/*.txt,art/drawing/delight-coffee/*,art/drawing/tidy-hand/*"
exclude_filter="tests/*,data/*proof*,study/*,full_view_study/*,perf_a/*,ui/pencil_marks.gd,web/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
